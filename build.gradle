plugins {
    // 钉选 6.0.54（MDK 写 [6.0,6.2)）；版本更新时同步 versions.js 矩阵。
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

// 版本号统一由 gradle.properties 的 mod_version 决定，避免和 mods.toml 不一致
version = mod_version
group = "com.maidtcr.maidtconstructrangedtools"
archivesBaseName = "maidtconstructrangedtools"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
        }
        server {
            workingDirectory project.file('run')
        }
        gameTestServer {
            workingDirectory project.file('run')
        }
        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all'
        }
    }
}

repositories {
    mavenCentral()
    // Modrinth 的 Maven 仓库，用于按版本 id 拉取目标模组（见下方依赖说明）
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

// 依赖来源二选一：
//   1) libs/ 下放了 jar（本地开发常用，jar 不入库）→ 直接用本地文件
//   2) libs/ 为空（GitHub 上 clone 下来就是这种情况）→ 走 Modrinth Maven
def localJars = file('libs').listFiles()?.findAll { it.name.endsWith('.jar') } ?: []

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.3.0"

    if (!localJars.isEmpty()) {
        compileOnly files(localJars)
    } else {
        // 目标模组本体（1.20.1 起 Forge 运行期使用官方映射，模组自身类未混淆，可直接 compileOnly 引用）
        compileOnly 'maven.modrinth:touhou-little-maid:g1SKoGQJ'   // 1.5.3-forge+mc1.20.1
        compileOnly 'maven.modrinth:tinkers-construct:kfptyb1D'    // 3.12.0.220
        compileOnly 'maven.modrinth:mantle:37ccXi7G'               // 1.11.117（匠魂的前置）
        compileOnly 'maven.modrinth:cloth-config:t8TXrZvZ'         // 11.1.136+forge（可选：配置界面）
    }
}

// mods.toml / pack.mcmeta 里的 ${mod_id} 等由 Gradle expand 替换（与 scaffold 的 {{}} 不冲突）。
def replaceProperties = [
    minecraft_version: "1.20.1", forge_version: "47.3.0",
    loader_version_range: loader_version_range,
    minecraft_version_range: minecraft_version_range,
    forge_version_range: forge_version_range,
    mod_id: "maidtconstructrangedtools", mod_name: mod_name, mod_license: mod_license,
    mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
]

processResources {
    // 关键：默认用平台编码（中文 Windows 上是 GBK）读取模板，会把 mods.toml 里的中文写成乱码
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_id,
            "Implementation-Version": project.version,
        ])
    }
    finalizedBy 'reobfJar'
}
